name: Render Server Keep Alive

on:
  schedule:
    # Run every 12 minutes
    - cron: '*/12 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        run: |
          curl -s -f "https://nelms-server.onrender.com/api/health" || echo "Ping failed or server starting"
